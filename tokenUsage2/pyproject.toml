[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenusage2"
description = "Live btop-style terminal dashboard for Claude Code, Codex CLI and OpenCode token usage across all local accounts."
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
authors = [{ name = "Marcel Petrick", email = "mail@marcelpetrick.it" }]
keywords = ["claude-code", "codex", "opencode", "tokens", "tui", "dashboard", "usage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dynamic = ["version"]
# Deliberately empty: the tool uses only the standard library, so it keeps
# working on a rolling-release distro without a dependency to break.
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.6", "build==1.6.0"]

[project.urls]
Source = "https://github.com/marcelpetrick/codingWithGPT/tree/master/tokenUsage2"

[tool.setuptools.dynamic]
version = { attr = "tokenusage2.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokenusage2 = ["py.typed"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["tokenusage2"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # Protocol classes only declare signatures; their `...` bodies never run.
    "class .*\\(Protocol\\):",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The dashboard draws with typographic glyphs (×, …) on purpose; they are
# exactly what the terminal should show, not look-alikes of ASCII letters.
"src/tokenusage2/render.py" = ["RUF001"]
"tests/*" = ["RUF001"]
