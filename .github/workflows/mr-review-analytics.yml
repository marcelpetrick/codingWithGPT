# SPDX-License-Identifier: GPL-3.0-or-later
name: mr-review-analytics

on:
  push:
    branches: [master]
    paths:
      - "20261126_MR_reviewFeedbackEvaluation/**"
      - ".github/workflows/mr-review-analytics.yml"
  pull_request:
    paths:
      - "20261126_MR_reviewFeedbackEvaluation/**"
      - ".github/workflows/mr-review-analytics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-pipeline:
    name: Local pipeline replica
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: 20261126_MR_reviewFeedbackEvaluation
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
      - name: Install Chromium system dependencies
        run: uv run --frozen playwright install-deps chromium
      - name: Run local pipeline
        run: ./localPipeline.sh
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mr-review-analytics-coverage-html
          path: 20261126_MR_reviewFeedbackEvaluation/htmlcov
          if-no-files-found: ignore
