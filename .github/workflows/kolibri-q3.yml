name: Kolibri Q3 checks
on:
  push:
    paths:
      - 'ollamaClaudeCode_v5_kolibri_tests/**'
      - '.github/workflows/kolibri-q3.yml'
  pull_request:
    paths:
      - 'ollamaClaudeCode_v5_kolibri_tests/**'
      - '.github/workflows/kolibri-q3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install coverage==7.14.0 ruff==0.17.2
      - run: ./localPipeline.sh
        working-directory: ollamaClaudeCode_v5_kolibri_tests
