/* Visual identity inspired by DATA MODUL Spectrum 2.0 (approximation, not a brand manual). */
:root {
  --deep: #003B70; --blue: #0078D4; --teal: #00B8A9; --green: #38A169; --red: #E54865;
  --amber: #F2A900; --gray: #8A94A6; --purple: #7B61FF; --orange: #DD6B20;
  --ink: #1B2430; --muted: #5B6676; --line: #E3E8EF; --bg: #FFFFFF; --soft: #F6F8FB;
  --spectrum: linear-gradient(90deg, #E54865 0%, #F2A900 22%, #38A169 44%, #00B8A9 62%, #0078D4 80%, #7B61FF 100%);
  --radius: 14px; --shadow: 0 1px 2px rgba(0,59,112,.06), 0 6px 18px rgba(0,59,112,.06);

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 14px/1.45 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  color: var(--ink); background: var(--bg); }
.spectrum { height: 6px; background: var(--spectrum); }
.noscript { padding: 2rem; color: var(--red); }
header.top { padding: 22px 32px 10px; display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; justify-content: space-between; }
header.top h1 { margin: 0; color: var(--deep); font-size: 26px; letter-spacing: -.01em; font-weight: 700; }
header.top h1 span { background: var(--spectrum); -webkit-background-clip: text; background-clip: text; color: transparent; }
.subtitle { color: var(--muted); margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--soft);
  border: 1px solid var(--line); color: var(--deep); font-size: 12px; white-space: nowrap; }
.chip.warn { background: #FFF4E5; border-color: #F6C98B; color: #8A4B00; }
.chip.bad { background: #FDECEF; border-color: #F3B3C0; color: #9B1C35; }
.chip.ok { background: #E9F7EF; border-color: #A9DFBF; color: #1E6B41; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 13px; color: var(--deep); }
.switch input { appearance: none; width: 38px; height: 22px; border-radius: 22px; background: #C9D3E0; position: relative; cursor: pointer; transition: background .2s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked { background: var(--red); }
.switch input:checked::after { transform: translateX(16px); }
nav.tabs { display: flex; gap: 4px; padding: 0 32px; border-bottom: 1px solid var(--line); overflow-x: auto; position: sticky; top: 0; background: rgba(255,255,255,.96); backdrop-filter: blur(6px); z-index: 20; }
nav.tabs button { border: 0; background: none; padding: 12px 14px; font: inherit; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--deep); font-weight: 600; border-image: var(--spectrum) 1; border-bottom: 3px solid; }
nav.tabs button:hover { color: var(--deep); }
.filters { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; padding: 12px 32px; background: var(--soft); border-bottom: 1px solid var(--line); }
.filters label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.filters select, .filters input[type=month], .filters input[type=search], .evtools input, .evtools select {
  font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid #CBD5E1; border-radius: 8px; background: #fff; color: var(--ink); }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { border: 1px solid #CBD5E1; background: #fff; border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; color: var(--muted); }
.pchip[aria-pressed="true"] { background: var(--deep); border-color: var(--deep); color: #fff; }
button.link, .btn { font: inherit; font-size: 12px; border: 1px solid #CBD5E1; background: #fff; border-radius: 8px; padding: 5px 10px; cursor: pointer; color: var(--deep); }
.btn:hover, button.link:hover { border-color: var(--blue); }
main { padding: 22px 32px 48px; max-width: 1500px; margin: 0 auto; }
h2 { color: var(--deep); font-size: 19px; margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; }
h2:first-child { margin-top: 4px; }
h3 { color: var(--deep); font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { position: relative; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 12px; box-shadow: var(--shadow); overflow: hidden; cursor: default; }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent, var(--blue)); }
.kpi.click { cursor: pointer; }
.kpi.click:hover { border-color: var(--accent, var(--blue)); }
.kpi .k { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.kpi .v { font-size: 26px; font-weight: 700; color: var(--deep); margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.info { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%;
  font-size: 10px; font-weight: 700; font-style: normal; color: var(--blue); border: 1px solid #A9C8EC; background: #F1F7FE; cursor: help; flex: none; }
.info:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
#tip { position: fixed; z-index: 100; max-width: 360px; background: #0F2340; color: #fff; padding: 8px 10px; border-radius: 8px; font-size: 12px;
  line-height: 1.45; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.25); white-space: pre-line; }
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(110px, 34%) 1fr 74px; align-items: center; gap: 10px; font-size: 13px; }
.bar.click { cursor: pointer; }
.bar.click:hover .track { outline: 1px solid var(--blue); }
.bar .lab { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.track { background: var(--soft); border-radius: 6px; height: 14px; overflow: hidden; }
.fill { height: 100%; border-radius: 6px; min-width: 2px; }
.bar .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.stack { display: flex; height: 26px; border-radius: 8px; overflow: hidden; background: var(--soft); }
.stack > div { height: 100%; min-width: 2px; cursor: pointer; transition: filter .15s; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 600; overflow: hidden; }
.stack > div:hover { filter: brightness(1.1) saturate(1.1); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.legend span.item { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.hist { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding-top: 8px; }
.hist .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; cursor: default; }
.hist .colbar { width: 100%; border-radius: 6px 6px 2px 2px; min-height: 2px; }
.hist .cl { font-size: 10px; color: var(--muted); margin-top: 4px; text-align: center; white-space: nowrap; }
.hist .cv { font-size: 11px; color: var(--ink); margin-bottom: 2px; font-variant-numeric: tabular-nums; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.stats b { color: var(--deep); font-variant-numeric: tabular-nums; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { font-size: 11px; fill: var(--muted); }
svg.chart .grid line { stroke: var(--line); }
svg.chart .dot { cursor: pointer; }
svg.chart .hit { fill: transparent; cursor: pointer; }
svg.chart .hit:hover { fill: rgba(0,120,212,.06); }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
thead th { position: sticky; top: 0; background: #fff; z-index: 5; text-align: left; font-weight: 600; color: var(--deep); padding: 8px 10px; border-bottom: 2px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; }
thead th .info { margin-left: 4px; vertical-align: -3px; }
thead th.sorted::after { content: " ▾"; color: var(--blue); }
thead th.sorted.asc::after { content: " ▴"; }
td:first-child { white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:hover td { background: #F8FBFF; }
tr.click { cursor: pointer; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.lowN { color: var(--muted); font-style: italic; }
.lowN::after { content: " ⚠"; font-style: normal; color: var(--amber); }
.clues { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 12px; }
.clue { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: #fff; cursor: pointer; box-shadow: var(--shadow); transition: transform .1s, border-color .1s; }
.clue:hover { transform: translateY(-1px); border-color: var(--blue); }
.clue .ic { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #fff; }
.clue .t { font-weight: 600; color: var(--deep); }
.clue .d { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.banner { border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.banner.b-warn { background: #FFF4E5; border: 1px solid #F6C98B; color: #6B3A00; }
.banner.b-info { background: #EEF6FF; border: 1px solid #B8D7F7; color: #0B3B66; }
.facets { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.facet { background: #EEF6FF; border: 1px solid #B8D7F7; color: var(--deep); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.facet button { border: 0; background: none; cursor: pointer; color: var(--blue); font-size: 14px; line-height: 1; }
.evtools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
.excerpt { max-width: 520px; white-space: pre-wrap; overflow-wrap: anywhere; }
.detail td { background: var(--soft); }

.detail dt { color: var(--muted); }
.pager { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--muted); }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
.defs td:first-child { white-space: nowrap; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 13px; }
.kv div:nth-child(odd) { color: var(--muted); }
footer { color: var(--muted); font-size: 12px; padding: 18px 32px 30px; border-top: 1px solid var(--line); }
.empty { color: var(--muted); font-style: italic; padding: 12px 0; }

@media print { nav.tabs, .filters { position: static; } #tip { display: none; } }
