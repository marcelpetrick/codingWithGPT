[tool.black]
target-version = ["py314"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "EXE", "F", "I", "SIM"]

[tool.coverage.run]
source_pkgs = ["traffic_light", "agent_status"]
disable_warnings = ["module-not-imported"]

[tool.coverage.report]
show_missing = true
