---
name: Check and release
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14.10'
      - name: Install the pinned check tools
        run: >-
          python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Check source and documentation
        run: |
          ruff check traffic_light.py tests tools
          black --check traffic_light.py tests tools
          pymarkdown --config .pymarkdown.json scan README.md docs
          yamllint --strict .github/workflows
      - name: Check workflow syntax
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/check.yml
      - name: Test the controller
        run: |
          coverage erase
          coverage run --append -m unittest discover -s tests
          coverage run --append traffic_light.py --help
          coverage report --precision=2
          coverage json -o - | python tools/check_coverage.py
          python tools/mutation_check.py
      - name: Build and test the Linux archive
        run: |
          python tools/build_release.py v0.0.0
          (cd dist && sha256sum --check SHA256SUMS)

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14.10'
      - name: Build and check release files
        run: |
          python tools/build_release.py "$GITHUB_REF_NAME"
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Attach files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-file dist/CHANGELOG.md
