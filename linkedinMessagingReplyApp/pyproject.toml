[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-reply-assistant"
description = "Local desktop assistant: capture a LinkedIn conversation, draft a reply with Ollama, insert it. Never sends."
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
authors = [{ name = "Marcel Petrick", email = "mail@marcelpetrick.it" }]
dynamic = ["version"]
dependencies = [
    "dbus-fast==5.2.0",
    "httpx==0.28.1",
    "Pillow==13.0.0",
    "PyGObject==3.58.1",
    "PySide6-Essentials==6.12.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "build==1.6.1",
    "mypy==2.4.0",
    "playwright==1.64.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-qt==4.5.0",
    "ruff==0.17.3",
    "pygobject-stubs==2.20.0",
    "types-PyYAML==6.0.12.20260906",
]

[project.scripts]
lra = "linkedin_reply_assistant.cli:main"
lra-native-host = "linkedin_reply_assistant.browser_bridge.native_host:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linkedin_reply_assistant = ["defaults/*.yaml", "defaults/prompts/*.md"]

[tool.setuptools.dynamic]
version = { attr = "linkedin_reply_assistant.version.__version__" }

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=linkedin_reply_assistant",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=95",
]
testpaths = ["tests/unit", "tests/integration"]
qt_api = "pyside6"
markers = ["live_ollama: calls the real Ollama backends (LIVE_OLLAMA=1)"]

[tool.coverage.run]
source = ["linkedin_reply_assistant"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Test data (TSV rows, JSON answers, call arguments) reads better on one line.
"tests/**" = ["E501"]
# dbus-fast reads D-Bus signatures from string annotations ("u", "a{sv}").
"tests/integration/fake_portal.py" = ["UP037", "F821", "F722", "E501"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]

[[tool.mypy.overrides]]
# mypy narrows `flow.state` across method calls that change it.
module = ["tests.unit.state.test_workflow"]
disable_error_code = ["comparison-overlap"]

[[tool.mypy.overrides]]
# dbus-fast reads D-Bus signatures from string annotations; mypy cannot type them.
module = ["tests.integration.fake_portal"]
disable_error_code = [
    "name-defined", "valid-type", "return-value", "arg-type", "untyped-decorator"
]
